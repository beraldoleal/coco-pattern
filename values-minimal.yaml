# Minimal CoCo install: essential confidential computing components only

main:
  clusterGroupName: minimal
clusterGroup:
  name: minimal
  isHubCluster: true
  namespaces:
    - open-cluster-management
    - openshift-sandboxed-containers-operator
    - trustee-operator-system
    - hello-openshift
    - kbs-access
  subscriptions:
    # ACM for policy management
    acm:
      name: advanced-cluster-management
      namespace: open-cluster-management
      channel: release-2.13
    # Only CoCo-specific operators
    sandbox:
      name: sandboxed-containers-operator
      namespace: openshift-sandboxed-containers-operator
      source: redhat-operators
      channel: stable
      installPlanApproval: Manual
      csv: sandboxed-containers-operator.v1.10.1
    trustee:
      name: trustee-operator
      namespace: trustee-operator-system
      source: redhat-operators
      channel: stable
      installPlanApproval: Manual
      csv: trustee-operator.v0.4.1
  projects:
    - acm
    - trustee
    - sandbox
    - workloads
    - default
  sharedValueFiles:
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
  applications:
    # ACM for policy management
    acm:
      name: acm
      namespace: open-cluster-management
      project: acm
      chart: acm
      chartVersion: 0.1.*
    # Only CoCo-specific applications
    trustee:
      name: trustee
      namespace: trustee-operator-system
      project: trustee
      path: charts/hub/trustee
    sandbox:
      name: sandbox
      namespace: openshift-sandboxed-containers-operator
      project: sandbox
      path: charts/coco-supported/sandbox
    hello-openshift:
      name: hello-openshift
      namespace: hello-openshift
      project: workloads
      path: charts/coco-supported/hello-openshift
  imperative:
    jobs:
      - name: install-deps
        playbook: ansible/install-deps.yaml
        verbosity: -vvv
        timeout: 3600
      - name: configure-azure-nat-gateway
        playbook: ansible/azure-nat-gateway.yaml
        verbosity: -vvv
        timeout: 3600
      - name: init-data-gzipper
        playbook: ansible/init-data-gzipper.yaml
        verbosity: -vvv
        timeout: 3600
